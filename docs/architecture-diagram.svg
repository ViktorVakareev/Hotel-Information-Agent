<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Hotel Information Agent — System Architecture</text>
  <text x="500" y="50" text-anchor="middle" font-size="13" fill="#6B7280">High-level view: User Input → Azure AI Foundry → Model → Response Output</text>

  <!-- User Input -->
  <rect x="30" y="150" width="160" height="90" rx="8" fill="#EAF1FB" stroke="#2C5AA0" stroke-width="1.5"/>
  <text x="110" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">User Input</text>
  <text x="110" y="205" text-anchor="middle" font-size="11" fill="#374151">Guest question via</text>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="#374151">website / mobile app</text>

  <!-- Azure AI Foundry Project container -->
  <rect x="260" y="90" width="500" height="240" rx="10" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="510" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Azure AI Foundry Project</text>

  <!-- API Endpoint -->
  <rect x="285" y="135" width="160" height="70" rx="8" fill="#FDF3E7" stroke="#B7791F" stroke-width="1.5"/>
  <text x="365" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">API Endpoint</text>
  <text x="365" y="180" text-anchor="middle" font-size="10.5" fill="#374151">Auth: Bearer / </text>
  <text x="365" y="193" text-anchor="middle" font-size="10.5" fill="#374151">DefaultAzureCredential</text>

  <!-- Agent (Hotel Information Agent) -->
  <rect x="285" y="230" width="160" height="80" rx="8" fill="#EAF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="365" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Agent</text>
  <text x="365" y="272" text-anchor="middle" font-size="10.5" fill="#374151">Hotel Information</text>
  <text x="365" y="285" text-anchor="middle" font-size="10.5" fill="#374151">Agent (instructions)</text>
  <text x="365" y="298" text-anchor="middle" font-size="10.5" fill="#374151">temp / top-p set here</text>

  <!-- Model -->
  <rect x="560" y="135" width="160" height="70" rx="8" fill="#EAF7EE" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="640" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Model</text>
  <text x="640" y="180" text-anchor="middle" font-size="10.5" fill="#374151">Deployed LLM</text>
  <text x="640" y="193" text-anchor="middle" font-size="10.5" fill="#374151">(Models + Endpoints)</text>

  <!-- Knowledge Base -->
  <rect x="560" y="230" width="160" height="80" rx="8" fill="#F5EEFC" stroke="#6B21A8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="640" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D7A">Knowledge Base</text>
  <text x="640" y="272" text-anchor="middle" font-size="10.5" fill="#4C1D7A">Uploaded hotel docs</text>
  <text x="640" y="285" text-anchor="middle" font-size="10.5" fill="#4C1D7A">(structured / unstructured /</text>
  <text x="640" y="298" text-anchor="middle" font-size="10.5" fill="#4C1D7A">dynamic)</text>

  <!-- Response Output -->
  <rect x="810" y="150" width="160" height="90" rx="8" fill="#EAF1FB" stroke="#2C5AA0" stroke-width="1.5"/>
  <text x="890" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Response Output</text>
  <text x="890" y="205" text-anchor="middle" font-size="11" fill="#374151">Answer displayed</text>
  <text x="890" y="220" text-anchor="middle" font-size="11" fill="#374151">to the guest</text>

  <!-- Arrows -->
  <line x1="190" y1="195" x2="280" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="445" y1="170" x2="555" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="365" y1="205" x2="365" y2="225" stroke="#444" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="445" y1="270" x2="555" y2="270" stroke="#444" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="720" y1="170" x2="805" y2="195" stroke="#444" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <text x="500" y="345" text-anchor="middle" font-size="11" fill="#6B7280">Solid arrows: request/response path. Dashed arrow: knowledge-base lookup during reasoning (when connected).</text>
  <text x="500" y="365" text-anchor="middle" font-size="10.5" fill="#9CA3AF">Alt text: User input flows to the API endpoint, into the Agent, which applies its configured instructions and</text>
  <text x="500" y="380" text-anchor="middle" font-size="10.5" fill="#9CA3AF">temperature/top-p, calls the Model, optionally consults the Knowledge Base, and returns a Response Output.</text>
</svg>
